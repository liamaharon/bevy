[package]
name = "bevy_ui_render"
version = "0.20.1"
edition = "2024"
description = "Provides rendering functionality for Bevy UI"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_app = { version = "0.20.1" }
bevy_asset = { version = "0.20.1" }
bevy_camera = { version = "0.20.1" }
bevy_color = { version = "0.20.1" }
bevy_core_pipeline = { version = "0.20.1" }
bevy_derive = { version = "0.20.1" }
bevy_ecs = { version = "0.20.1" }
bevy_extract = { version = "0.20.1" }
bevy_image = { version = "0.20.1" }
bevy_input_focus = { version = "0.20.1" }
bevy_math = { version = "0.20.1" }
bevy_mesh = { version = "0.20.1" }
bevy_reflect = { version = "0.20.1" }
bevy_shader = { version = "0.20.1" }
bevy_render = { version = "0.20.1" }
bevy_sprite = { version = "0.20.1" }
bevy_sprite_render = { version = "0.20.1", features = [
  "bevy_text",
] }
bevy_transform = { version = "0.20.1" }
bevy_utils = { version = "0.20.1" }
bevy_platform = { version = "0.20.1", default-features = false, features = [
  "std",
] }
bevy_ui = { version = "0.20.1" }
bevy_text = { version = "0.20.1" }
bevy_a11y = { version = "0.20.1" }

# other
bytemuck = { version = "1.5", features = ["derive"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
indexmap = { version = "2" }
smallvec = { version = "1", default-features = false }

[features]
default = ["bevy_ui_debug"]
serialize = ["bevy_math/serialize", "bevy_platform/serialize"]
bevy_ui_debug = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }
constants = { path = "../../constants" }
