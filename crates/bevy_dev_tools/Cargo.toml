[package]
name = "bevy_dev_tools"
version = "0.20.1"
edition = "2024"
description = "Collection of developer tools for the Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
bevy_audio = ["dep:bevy_audio"]
bevy_ci_testing = ["dep:serde", "dep:ron", "dep:bevy_render"]
screenrecording = ["dep:x264", "render"]
render = [
  "dep:bevy_render",
  "dep:bevy_core_pipeline",
  "dep:bevy_pbr",
  "dep:bevy_ui_render",
]
webgl = ["dep:bevy_render", "bevy_render?/webgl"]
webgpu = ["dep:bevy_render", "bevy_render?/webgpu"]
schedule_data = ["dep:serde", "dep:ron", "dep:bevy_utils", "dep:thiserror"]
serialize = ["dep:serde"]

[dependencies]
# bevy
bevy_animation = { version = "0.20.1" }
bevy_app = { version = "0.20.1" }
bevy_audio = { version = "0.20.1", optional = true }
bevy_asset = { version = "0.20.1" }
bevy_camera = { version = "0.20.1" }
bevy_color = { version = "0.20.1" }
bevy_core_pipeline = { version = "0.20.1", optional = true }
bevy_diagnostic = { version = "0.20.1" }
bevy_ecs = { version = "0.20.1" }
bevy_extract = { version = "0.20.1" }
bevy_image = { version = "0.20.1" }
bevy_input = { version = "0.20.1" }
bevy_light = { version = "0.20.1" }
bevy_log = { version = "0.20.1" }
bevy_math = { version = "0.20.1" }
bevy_pbr = { version = "0.20.1", optional = true }
bevy_picking = { version = "0.20.1" }
bevy_render = { version = "0.20.1", optional = true }
bevy_reflect = { version = "0.20.1" }
bevy_time = { version = "0.20.1" }
bevy_text = { version = "0.20.1" }
bevy_transform = { version = "0.20.1" }
bevy_shader = { version = "0.20.1" }
bevy_sprite = { version = "0.20.1" }
bevy_ui = { version = "0.20.1" }
bevy_ui_render = { version = "0.20.1", optional = true }
bevy_ui_widgets = { version = "0.20.1" }
bevy_utils = { version = "0.20.1", optional = true }
bevy_window = { version = "0.20.1" }
bevy_state = { version = "0.20.1" }
bevy_platform = { version = "0.20.1" }
bevy_mesh = { version = "0.20.1" }
bevy_world_serialization = { version = "0.20.1" }

# other
thiserror = { version = "2.0", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
ron = { version = "0.12", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Allow tests to depend on the names of systems.
bevy_ecs = { version = "0.20.1", features = [
  "debug",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
x264 = { version = "0.5.0", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }
bevy_pbr = { path = "../bevy_pbr" }
bevy_ui_render = { path = "../bevy_ui_render" }
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
